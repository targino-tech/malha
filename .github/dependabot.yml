version: 2
updates:
  # Dependabot uses the npm ecosystem for pnpm and reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /collector
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
