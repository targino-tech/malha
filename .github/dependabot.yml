version: 2

# Atualizações de versão sem pull request nem branch: open-pull-requests-limit 0.
# O Dependabot continua lendo as dependências e mostrando alertas de vulnerabilidade em
# Security → Dependabot alerts; o workflow Segurança audita pnpm e Go a cada mudança e toda segunda.
# Para atualizar, a manutenção aplica a mudança direto na main.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /collector
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
