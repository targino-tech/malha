title: '[Dúvida] '
body:
  - type: markdown
    attributes:
      value: Remova IPs, tokens, senhas e nomes reais de fazendas antes de enviar.
  - type: textarea
    id: pergunta
    attributes:
      label: Sua pergunta
    validations:
      required: true
