name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, banco e navegador
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_DB: malha_test
          POSTGRES_USER: malha_test
          POSTGRES_PASSWORD: malha_test_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U malha_test -d malha_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MALHA_MODE: demo
      MALHA_DEMO_DB: 'memory://'
      MALHA_TEST_DATABASE_URL: 'postgresql://malha_test:malha_test_ci@127.0.0.1:5432/malha_test'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  collector:
    name: Coletor Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: collector/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

  image:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Construir as imagens web e worker
        run: |
          docker build --target web -t malha-web:ci .
          docker build --target worker -t malha-worker:ci .
      - name: Subir a imagem web em modo demo
        run: |
          docker run -d --name malha-web -p 3000:3000 -e MALHA_MODE=demo -e MALHA_DEMO_DB=memory:// malha-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok"'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:3000/ | grep -q 'Visão geral das fazendas'
          curl -fsS -o /dev/null http://127.0.0.1:3000/site
      - name: Registros da imagem web
        if: ${{ always() }}
        run: docker logs malha-web || true
      - name: Executar a CLI da imagem do worker
        run: |
          output="$(docker run --rm -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci malha-worker:ci node dist/manage.js 2>&1 || true)"
          echo "$output"
          grep -q 'Use migrate' <<< "$output"

  infra:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
