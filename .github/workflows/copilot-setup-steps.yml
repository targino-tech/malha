name: Ambiente do agente de código

# Prepara o ambiente do agente de código do GitHub (aba Agents) antes de ele trabalhar numa issue:
# Node.js e pnpm do projeto, dependências e o Chromium do Playwright. Também roda sozinho para validar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/copilot-setup-steps.yml']
  pull_request:
    paths: ['.github/workflows/copilot-setup-steps.yml']

permissions:
  contents: read

jobs:
  # O nome do job precisa ser exatamente este para o agente reconhecer.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MALHA_MODE: demo
      MALHA_DEMO_DB: 'memory://'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
