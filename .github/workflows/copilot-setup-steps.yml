name: Ambiente do agente de código

# Prepara o ambiente do agente de código do GitHub (aba Agents) antes de ele trabalhar numa issue:
# Node.js e pnpm do projeto, dependências e o Chromium do Playwright. Também roda sozinho para validar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/copilot-setup-steps.yml']
  pull_request:
    paths: ['.github/workflows/copilot-setup-steps.yml']

permissions:
  contents: read

jobs:
  # O nome do job precisa ser exatamente este para o agente reconhecer.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MALHA_MODE: demo
      MALHA_DEMO_DB: 'memory://'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, versão e hash vêm do packageManager
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
