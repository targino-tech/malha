<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Linha do tempo do Malha</title>
  <desc id="d">Base: MVP inicial; Fase 1: Ocorrências; Fase 2: Operação; Fase 3: Valor medido; Fase 4: Produção.</desc>
  <style>
    .pulse { stroke-dasharray: 60 820; animation: run 3.6s cubic-bezier(.45,0,.55,1) infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.6s ease-out infinite; }
    @keyframes run { from { stroke-dashoffset: 60 } to { stroke-dashoffset: -880 } }
    @keyframes halo { 0% { opacity: .8; transform: scale(.8) } 100% { opacity: 0; transform: scale(2.4) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sheen, .pulse { display: none; } }
  </style>
  <rect width="1200" height="330" rx="24" fill="#120f09"/>
  <path d="M110 110 H990" stroke="#d9b866" stroke-width="6" stroke-linecap="round"/>
  <path class="pulse" d="M110 110 H990" stroke="#f5fbe9" stroke-width="6" stroke-linecap="round"/>
  <g>
    
