<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Fluxo de branches do Malha</title>
  <desc id="d">Mudanças entram por branches feat em PRs para a main. A main é promovida para staging, que implanta em homologação, e staging é promovida para production com aprovação.</desc>
  <style>
    .lane { stroke-dasharray: 2 12; animation: lane 2s linear infinite; }
    .merge { fill: none; stroke-width: 3; stroke-dasharray: 8 8; animation: lane 1.2s linear infinite; }
    .commit { transform-box: fill-box; transform-origin: center; animation: commit 2.4s ease-in-out infinite; }
    @keyframes lane { to { stroke-dashoffset: -28 } }
    @keyframes commit { 0%, 100% { transform: scale(.9) } 50% { transform: scale(1.12) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sheen, .pulse { display: none; } }
  </style>
  <rect width="1200" height="380" rx="24" fill="#071009"/>
  <text x="40" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#d9b866">feat/*</text>
  <text x="40" y="95" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#7f9584">uma mudança por PR</text>
  <path class="lane" d="M260 70 H1160" stroke="#d9b866" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <text x="40" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#b6f37a">main</text>
  <text x="40" y="175" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#7f9584">integração, CI obrigatório</text>
  <path class="lane" d="M260 150 H1160" stroke="#b6f37a" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <text x="40" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#7fd1ae">staging</text>
  <text x="40" y="255" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#7f9584">deploy automático em homologação</text>
  <path class="lane" d="M260 230 H1160" stroke="#7fd1ae" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <text x="40" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#f1b45b">production</text>
  <text x="40" y="335" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#7f9584">promove o mesmo digest, com aprovação</text>
  <path class="lane" d="M260 310 H1160" stroke="#f1b45b" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path class="merge" d="M320 70 C380 70 380 150 440 150" stroke="#d9b866"/>
  <path class="merge" d="M560 70 C620 70 620 150 680 150" stroke="#d9b866"/>
  <path class="merge" d="M480 150 C540 150 540 230 600 230" stroke="#b6f37a"/>
  <path class="merge" d="M720 150 C780 150 780 230 840 230" stroke="#b6f37a"/>
  <path class="merge" d="M880 230 C940 230 940 310 1000 310" stroke="#7fd1ae"/>
  <circle class="commit" style="animation-delay:0.0s" cx="320" cy="70" r="9" fill="#d9b866" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:0.2s" cx="560" cy="70" r="9" fill="#d9b866" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:0.4s" cx="440" cy="150" r="9" fill="#b6f37a" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:0.6s" cx="480" cy="150" r="9" fill="#b6f37a" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:0.8s" cx="680" cy="150" r="9" fill="#b6f37a" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:1.0s" cx="720" cy="150" r="9" fill="#b6f37a" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:1.2s" cx="600" cy="230" r="9" fill="#7fd1ae" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:1.4s" cx="840" cy="230" r="9" fill="#7fd1ae" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:1.6s" cx="880" cy="230" r="9" fill="#7fd1ae" stroke="#071009" stroke-width="3"/><circle class="commit" style="animation-delay:1.8s" cx="1000" cy="310" r="9" fill="#f1b45b" stroke="#071009" stroke-width="3"/>
  <text x="1000" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f1b45b">deploy</text>
  <text x="600" y="210" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7fd1ae">deploy</text>
  <text x="840" y="210" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#7fd1ae">deploy</text>
</svg>
